
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panorama Viewer</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
    }
    #panorama {
      width: 100%;
      height: 100%;
    }
    #message {
      color: white;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <div id="message">Loading panorama...</div>

  <script>
    async function startViewer() {
      const message = document.getElementById("message");
      const params = new URLSearchParams(location.search);
      const configPath = params.get("config");

      try {
        if (!configPath) {
          throw new Error("URL-এ config দেওয়া হয়নি।");
        }

        const configURL = new URL(configPath, location.href);

        if (configURL.origin !== location.origin) {
          throw new Error("Config অবশ্যই নিজের ওয়েবসাইটে থাকতে হবে।");
        }

        const response = await fetch(configURL);

        if (!response.ok) {
          throw new Error("Config ফাইল পাওয়া যায়নি।");
        }

        const config = await response.json();

        function fixImagePath(scene) {
          if (
            scene.panorama &&
            !/^(https?:|data:|blob:)/i.test(scene.panorama)
          ) {
            scene.panorama = new URL(
              scene.panorama, configURL
            ).href;
          }
        }

        if (config.scenes) {
          Object.values(config.scenes).forEach(fixImagePath);
        } else {
          fixImagePath(config);
        }

        const selectedScene = params.get("scene");

        if (
          selectedScene &&
          config.scenes &&
          config.scenes[selectedScene]
        ) {
          config.default = selectedScene;
        }

        message.style.display = "none";
        pannellum.viewer("panorama", config);

      } catch (error) {
        message.textContent = "Error: " + error.message;
      }
    }

    startViewer();
  </script>
</body>
</html>
