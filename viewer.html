<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Pannellum Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <style>
    html, body, #panorama { width: 100%; height: 100%; margin: 0; background: #111; }
    #status {
      position: fixed; z-index: 10; top: 12px; left: 12px;
      padding: 8px 12px; background: white; color: black;
      font: 14px Arial, sans-serif; max-width: calc(100% - 48px);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="status">Loading configuration...</div>
  <div id="panorama"></div>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script>
    (async function () {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const query = location.search;
      let configPath = params.get("config");
      let videoId = params.get("video");

      if (query.includes("?video-")) {
        videoId = query.slice(query.lastIndexOf("?video-") + 7);
      }
      if (!configPath) configPath = "configs/park.json";

      let configURL;
      try {
        // Decode only until the special path becomes readable.
        // This handles both once-encoded and multiply-encoded config values.
        for (let i = 0; i < 3 && /%[0-9a-f]{2}/i.test(configPath); i++) {
          const decoded = decodeURIComponent(configPath);
          if (decoded === configPath) break;
          configPath = decoded;
        }

        // Normalize slash/backslash prefixes, e.g.
        // /\/mirrorblogs.github.io/enm/ena/pannellum.json
        // or //mirrorblogs.github.io/enm/ena/pannellum.json
        configPath = configPath.replace(/^[\/\\]+/, "");

        // Strip embedded host and map the JSON to the repository's Pages path.
        if (configPath.startsWith("mirrorblogs.github.io/")) {
          configPath = configPath.slice("mirrorblogs.github.io/".length);
        }

        // The supplied file lives at /pano-site/enm/ena/pannellum.json.
        if (configPath.startsWith("enm/ena/")) {
          configPath = "/pano-site/" + configPath;
        } else if (configPath.startsWith("pano-site/")) {
          configPath = "/" + configPath;
        } else if (configPath.startsWith("/enm/ena/")) {
          configPath = "/pano-site" + configPath;
        }

        // Also accept a full URL to the same hosted JSON.
        if (/^https:\/\/mirrorblogs\.github\.io\//i.test(configPath)) {
          const remote = new URL(configPath);
          if (remote.pathname.startsWith("/pano-site/")) {
            configPath = remote.pathname;
          } else if (remote.pathname.startsWith("/enm/ena/")) {
            configPath = "/pano-site" + remote.pathname;
          }
        }

        configURL = new URL(configPath, location.origin);
        const allowedPrefix = "/pano-site/";
        if (
          configURL.origin !== location.origin ||
          !configURL.pathname.startsWith(allowedPrefix) ||
          !configURL.pathname.endsWith(".json")
        ) {
          throw new Error("Config path rejected: " + configURL.href);
        }

        status.textContent = "Loading panorama...";
        const response = await fetch(configURL.href);
        if (!response.ok) throw new Error("Config HTTP error: " + response.status);
        const config = await response.json();

        if (videoId) config.title = (config.title || "Panorama") + " — " + videoId;
        pannellum.viewer("panorama", config);
        status.textContent = videoId ? "Content ID: " + videoId : "Panorama loaded";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        console.error("Pannellum config error:", error, {
          originalConfig: params.get("config"),
          resolvedURL: configURL && configURL.href
        });
      }
    })();
  </script>
</body>
</html>
