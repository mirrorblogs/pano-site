<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Pannellum Viewer</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <style>
    html, body, #panorama {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: white;
      color: black;
      font: 14px Arial, sans-serif;
      max-width: calc(100% - 48px);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="status">Loading configuration...</div>
  <div id="panorama"></div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <script>
    (async function () {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const query = location.search;

      let configPath = params.get("config");
      let videoId = params.get("video");

      // Support: ?config=configs/park.json?video-park-360
      if (query.includes("?video-")) {
        const marker = query.lastIndexOf("?video-");
        videoId = query.slice(marker + 7);
      }

      if (!configPath) {
        configPath = "configs/park.json";
      }

      let configURL;

      try {
        // URLSearchParams has already decoded percent-encoding once.
        // Support the special form:
        // ?config=/%5C%2Fmirrorblogs.github.io%2Fenm%2Fena%2Fpannellum.json
        // which decodes to: /\/mirrorblogs.github.io/enm/ena/pannellum.json
        if (configPath.startsWith("/\\/")) {
          configPath = configPath.slice(3);
        }

        // Convert the special host/path form to this GitHub Pages site's
        // actual repository path.
        if (configPath.startsWith("mirrorblogs.github.io/")) {
          configPath = "/pano-site/" +
            configPath.slice("mirrorblogs.github.io/".length);
        }

        // Also accept an explicit URL on the same GitHub Pages site.
        if (configPath.startsWith("https://mirrorblogs.github.io/")) {
          const remote = new URL(configPath);
          if (remote.pathname.startsWith("/enm/ena/")) {
            configPath = "/pano-site" + remote.pathname;
          } else if (remote.pathname.startsWith("/pano-site/")) {
            configPath = remote.pathname;
          }
        }

        configURL = new URL(configPath, location.href);

        const allowedOrigin = location.origin;
        const allowedPrefix = new URL("/pano-site/", allowedOrigin).pathname;

        if (
          configURL.origin !== allowedOrigin ||
          !configURL.pathname.startsWith(allowedPrefix) ||
          !configURL.pathname.endsWith(".json")
        ) {
          throw new Error("Config must be a JSON file in this GitHub Pages site.");
        }

        status.textContent = "Loading panorama...";

        const response = await fetch(configURL.href);
        if (!response.ok) {
          throw new Error("Config HTTP error: " + response.status);
        }

        const config = await response.json();

        if (videoId) {
          config.title = (config.title || "Panorama") + " — " + videoId;
        }

        pannellum.viewer("panorama", config);

        status.textContent = videoId
          ? "Content ID: " + videoId
          : "Panorama loaded";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        console.error("Pannellum config error:", error, {
          originalConfig: params.get("config"),
          resolvedURL: configURL && configURL.href
        });
      }
    })();
  </script>
</body>
</html>
